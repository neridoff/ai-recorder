# CI (E5.2): сборка, тесты и сборка .app на каждый push в main и на pull request.
# Модели (610 МБ) не скачиваются: тесты подменяют движки заглушками.
name: CI

# Правки только текста (.md) Mac-раннер не занимают: их на GitHub мало, очередь бывает долгой.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_call:   # release.yml запускает те же проверки перед релизом

permissions:
  contents: read

# Новый push в pull request отменяет устаревший прогон. В main прогоны не отменяются:
# отменённый прогон значок CI показывает как «failing».
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-14   # Apple Silicon, как у пользователей (install.sh требует arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Код собирается только Swift 6+: по умолчанию на macos-14 стоит Xcode 15.4 (Swift 5.10)
      - name: Xcode 16 (Swift 6)
        run: |
          ls -d /Applications/Xcode_*.app
          xcode="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "::error::На раннере нет Xcode 16"; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Версии
        run: |
          sw_vers
          uname -m
          swift --version
          xcode-select -p

      - name: Проверка скриптов (bash 3.2)
        run: |
          for f in install.sh scripts/*.sh; do /bin/bash -n "$f"; done

      - name: Кеш sherpa-onnx и whisper.xcframework
        uses: actions/cache@v4
        with:
          path: |
            Vendor/sherpa-onnx
            ~/Library/Caches/org.swift.swiftpm
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-sherpa-onnx.sh', 'Package.swift') }}

      - name: Библиотека sherpa-onnx
        run: ./scripts/fetch-sherpa-onnx.sh

      - name: Тесты
        run: swift test

      - name: Сборка AIRecorder.app
        run: |
          ./scripts/build-app.sh
          codesign --verify --strict build/AIRecorder.app
          test -f build/AIRecorder.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/AIRecorder.app/Contents/Info.plist
